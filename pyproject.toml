[project]
name = "sittuyin-ml-engine-development"
version = "0.1.0"
description = "A learning and playing platform with a custom Sittuyin chess engine and machine learning pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.uv]
package = false
